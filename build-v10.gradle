buildscript {
    repositories {
        maven {
            url = System.getenv('OWASP_MAVEN_REPOSITORY_URL') ?: 'https://artifactory.platform.hmcts.net/artifactory/maven-remotes'
        }
    }

    dependencies {
        classpath  group: 'org.postgresql', name: 'postgresql', version: '42.7.5'
    }
}
plugins {
    id "org.flywaydb.flyway" version "9.22.3"
    id 'org.owasp.dependencycheck' version '12.2.2'
}

group = 'uk.gov.hmcts'


repositories {
    maven {
        url = System.getenv('OWASP_MAVEN_REPOSITORY_URL') ?: 'https://artifactory.platform.hmcts.net/artifactory/maven-remotes'
    }
}
